<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Form Fields</title>
  <link rel="stylesheet" href="/assets/style.css"/>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand"><div class="brand-badge">XSS</div><div>Form Fields</div></div>
      <div class="nav"><a class="pill" href="/index.html">← Back to index</a></div>
    </div>
  </div>
  <div class="wrapper">
    <div class="hero"><h1>Form Fields</h1></div>
    <div class="card">
      <h1>DOM-Based XSS Demonstration</h1>

  <label>
    Name:
    <input type="text" id="name">
  </label>
  <br><br>

  <label>
    Eye color:
    <select id="eyes">
      <option value="blue">Blue</option>
      <option value="green">Green</option>
      <option value="brown">Brown</option>
    </select>
  </label>
  <br><br>

  <label>
    Do you like movies?
    <input type="checkbox" id="movies">
  </label>
  <br><br>

  <label>
    Favorite sentence:
    <br>
    <textarea id="sentence" rows="4" cols="40"></textarea>
  </label>
  <br><br>

  <button onclick="updateOutput()">Submit</button>

  <hr>

  <h2>Output</h2>
  <div id="output"></div>

  <script>
    function updateOutput() {
      const name = document.getElementById("name").value;
      const eyes = document.getElementById("eyes").value;
      const likesMovies = document.getElementById("movies").checked ? "like" : "dislike";
      const sentence = document.getElementById("sentence").value;

      // ❌ Vulnerable DOM-based XSS sink
      document.getElementById("output").innerHTML =
        "Hello " + name + ",<br>" +
        "Your eye color is " + eyes + ".<br>" +
        "You " + likesMovies + " movies.<br>" +
        "Your favorite sentence is: " + sentence;
    }
  </script>
    </div>
    <div class="footer">cyber-course</div>
  </div>
</body>
</html>
