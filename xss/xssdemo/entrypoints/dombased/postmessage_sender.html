<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DOM XSS Demo – postMessage Sender</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 12px; }
    label { display: block; margin: 12px 0; }
    input { width: 100%; padding: 6px; }
    iframe { width: 100%; height: 320px; border: 1px solid #ddd; border-radius: 10px; }
    button { margin-right: 8px; margin-top: 6px; }
    code { background: #f3f3f3; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>

  <h1>Sender: postMessage to Receiver</h1>

  <p>
    This page simulates an external sender. It loads the receiver page in an iframe
    or a popup window, then uses <code>postMessage</code> to send data.
  </p>

  <label>
    Receiver URL:
    <input id="receiverUrl" value="http://xssdemo/entrypoints/dombased/postmessage_receiver.html">
  </label>

  <label>
    Message to send (harmless demo markup by default):
    <input id="msg" value="&lt;b&gt;[TEST]&lt;/b&gt; Hello from sender">
  </label>

  <button id="loadBtn">Load Receiver in iframe</button>
  <button id="popupBtn">Open Receiver as popup</button>
  <button id="sendBtn">Send postMessage</button>

  <hr>
  <iframe id="frame" title="receiver frame"></iframe>

  <script>
    /**********************************************************************
     * BEGINNER NOTES: How sender talks to receiver
     *
     * - We load the receiver page inside an iframe OR open it as a popup.
     * - Then we send a message to that window using postMessage:
     *
     *     targetWindow.postMessage(data, targetOrigin)
     *
     * targetOrigin is IMPORTANT:
     * - "*" means "any origin" (unsafe in real apps)
     * - Better: "https://receiver.example" (exact origin)
     **********************************************************************/

    const frame = document.getElementById("frame");

    // NEW: keep a reference to the popup window (if used)
    let popupWindow = null;

    // ---------------------------------------------------------------
    // Load receiver inside an iframe
    // ---------------------------------------------------------------
    document.getElementById("loadBtn").addEventListener("click", () => {
      frame.src = document.getElementById("receiverUrl").value;

      // If we previously opened a popup, ignore it
      popupWindow = null;
    });

    // ---------------------------------------------------------------
    // NEW: Open receiver as a popup window
    // ---------------------------------------------------------------
    document.getElementById("popupBtn").addEventListener("click", () => {
      const url = document.getElementById("receiverUrl").value;

      // window.open returns a reference to the new window
      popupWindow = window.open(
        url,
        "receiverPopup",
        "width=900,height=500"
      );
    });

    // ---------------------------------------------------------------
    // Send postMessage to iframe OR popup
    // ---------------------------------------------------------------
    document.getElementById("sendBtn").addEventListener("click", () => {
      const message = document.getElementById("msg").value;

      let targetWindow = null;

      // Prefer popup if it exists and is still open
      if (popupWindow && !popupWindow.closed) {
        targetWindow = popupWindow;
      }
      // Otherwise fall back to iframe
      else if (frame.contentWindow) {
        targetWindow = frame.contentWindow;
      }

      if (!targetWindow) {
        alert("Load the receiver first (iframe or popup).");
        return;
      }

      // ⚠️ For real applications, do NOT use "*".
      // Use the exact receiver origin instead.
      //
      // We use "*" here to keep the demo simple and show how messages
      // can be sent cross-origin.
      targetWindow.postMessage(message, "*");
    });
  </script>

</body>
</html>
